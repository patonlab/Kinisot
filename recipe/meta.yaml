# Update version and sha256 from the PyPI release when submitting to conda-forge.
{% set name = "kinisot" %}
{% set version = "2.0.2" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 0a37f1efe3810d3bff13e288b378f3c9cf9e65eca85d31c7aa679570cca78399

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  entry_points:
    - kinisot = kinisot.cli:main

requirements:
  host:
    - pip
    - python >=3.9
    - setuptools >=64
  run:
    - numpy >=1.22
    - goodvibes >=4.4
    - python >=3.9

test:
  imports:
    - kinisot
  commands:
    - kinisot --version

about:
  home: "https://github.com/patonlab/kinisot"
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: "Compute Kinetic and Equibrium Isotope Effects from compchem outputs"
  doc_url: https://github.com/patonlab/kinisot
  dev_url: https://github.com/patonlab/kinisot

extra:
  recipe-maintainers:
    - bobbypaton
