# Kinisot is not on conda-forge yet. This is the recipe to submit to
# conda-forge/staged-recipes (see CONTRIBUTING.md); update version and sha256
# from the PyPI release first. Once a kinisot-feedstock exists, its bot
# follows each PyPI release and this file is no longer needed.
{% set name = "kinisot" %}
{% set version = "2.5.0" %}
{% set python_min = "3.9" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: "https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz"
  sha256: 02c0080a95b31b96c0fc91d183624044e7a092b640f054d6043a9cc67479a802

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation"
  entry_points:
    - kinisot = kinisot.cli:main

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=64
  run:
    - numpy >=1.22
    - goodvibes >=4.4
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - kinisot
  commands:
    - kinisot --version

about:
  home: "https://github.com/patonlab/kinisot"
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: "Compute kinetic and equilibrium isotope effects from computational chemistry outputs"
  doc_url: https://github.com/patonlab/kinisot
  dev_url: https://github.com/patonlab/kinisot

extra:
  recipe-maintainers:
    - bobbypaton
