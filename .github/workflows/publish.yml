name: Publish to PyPI

# Publishes a release to PyPI when a version tag (v2.1.0, v2.1.1, ...) is pushed.
# Uses PyPI "trusted publishing" (OpenID Connect), so no API token is stored in
# the repository. One-time setup, documented in CONTRIBUTING.md:
#   1. On pypi.org, project "kinisot" -> Manage -> Publishing -> add publisher:
#      owner "patonlab", repository "Kinisot", workflow "publish.yml", environment "pypi".
#   2. In this repository: Settings -> Environments -> create "pypi" (optionally
#      require a reviewer to approve each release).
#   3. Bump __version__ in kinisot/__init__.py, update CHANGELOG.md, then
#      git tag v<version> && git push origin v<version>.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check that the tag matches kinisot.__version__
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('kinisot/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "kinisot.__version__ is $version but the tag is $tag" >&2
            exit 1
          fi

      - name: Run the tests
        run: |
          python -m pip install ".[test]"
          pytest tests/ -q

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Check the wheel is small (no test data)
        run: |
          size=$(stat -c %s dist/*.whl)
          echo "wheel size: $size bytes"
          test "$size" -lt 200000

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kinisot/
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
