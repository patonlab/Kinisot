name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff build
      - run: ruff check .
      - run: ruff format --check .
      - name: Build the wheel and check that every subpackage is inside
        run: |
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          names = {i.filename for i in zipfile.ZipFile(glob.glob("dist/*.whl")[0]).infolist()}
          for required in ("kinisot/backends/__init__.py", "kinisot/backends/ase.py", "kinisot/isotope_data.py"):
              assert required in names, "missing from the wheel: " + required
          data = [n for n in names if n.endswith((".out", ".hess", ".dat"))]
          assert not data, "test data must not ship in the wheel: %r" % data
          print("wheel ok:", len(names), "files")
          PY

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable, so coverage measures the source tree) and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,ase]"

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=kinisot --cov-report=term-missing --cov-fail-under=80
